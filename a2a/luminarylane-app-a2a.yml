discovery:
  path: /.well-known/agent-card.json
  canonical: true
  host: luminarylane.app
  note: >-
    Served identically (same 5,915-byte body, application/json, cache-control public max-age=3600)
    from the apex luminarylane.app and from www.luminarylane.app. The legacy /.well-known/agent.json
    404s on both hosts, and neither app.luminarylane.app nor mcp.luminarylane.app serves a card. The
    provider names this exact URL in its own robots.txt ("A2A Agent Card for AI agent discovery")
    and in the "Technical" section of its llms.txt, and the apex DNS carries an
    a2a-registry-verify TXT record, so ownership is not in question. A negative-control probe of
    /.well-known/luminarylane-app-negative-control-4b7d2e.json returned a real 404 on every host,
    so the 200 is not a catch-all.
