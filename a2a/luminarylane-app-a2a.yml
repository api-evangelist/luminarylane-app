conformance:
  spec: A2A 1.0.0
  grade: flavored
  protocol_version: null
  preferred_transport: null
  hard_checks:
    capabilities_is_object: true
    protocol_version_present: false
    skills_is_array: true
  optional_fields:
    default_input_modes: true
    default_output_modes: true
    preferred_transport: false
  grade_basis: >-
    Two of three hard checks pass — capabilities is an object of booleans and skills is an array of six
    fully populated skills (id, name, description, tags, examples, inputModes, outputModes) — but the
    card carries NO protocolVersion anywhere: not at the top level (A2A 0.2/0.3 shape) and there is
    no supportedInterfaces[] (A2A 1.0.0 shape) to carry it either. Failing any hard check grades the
    card flavored. defaultInputModes and defaultOutputModes are both present.
  deviations:
  - field: protocolVersion
    observed: absent
    note: No protocol version is declared in any A2A-shaped location, so a client cannot tell which revision of the protocol the card was written against.
  - field: authentication
    observed: 'object {schemes: [], credentials: null}'
    note: authentication is the pre-0.2 field name; current revisions use securitySchemes + security. The declared scheme list is empty.
  - field: url
    observed: https://www.luminarylane.app
    note: The url is the marketing site root, which answers 405 to a JSON-RPC POST. The card declares no invocable A2A endpoint.
  - field: capabilities.stateTransitionHistory
    observed: false
    note: Declared with the 0.2-era key set (streaming, pushNotifications, stateTransitionHistory); extensions and extendedAgentCard are not declared.
  - field: preferredTransport / supportedInterfaces / additionalInterfaces
    observed: absent
    note: No transport binding is declared under any revision's field name.
surface_relationship:
  note: >-
    Luminary Lane publishes two agent surfaces that are not projections of each other. The A2A card
    describes six advisory skills of the Lane agent with no callable endpoint. The remote MCP server
    at https://mcp.luminarylane.app/mcp (see mcp/luminarylane-app-mcp.yml) exposes 46 workspace tools
    behind OAuth 2.1 / API-key auth, and is the surface an agent can actually call.
