agent_card:
  name: Lane
  description: >-
    AI CMO that never sleeps. Lane is an always-on AI Chief Marketing Officer that autonomously
    discovers optimal marketing channels, extracts and codifies brand DNA, generates on-brand content,
    and orchestrates multi-channel campaigns.
  version: 1.0.0
  url: https://www.luminarylane.app
