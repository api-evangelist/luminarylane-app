apis:
- name: Luminary Lane MCP Server
  description: >-
    Remote Model Context Protocol server (Streamable HTTP, server name luminary-mcp-server v1.0.0) that
    exposes a customer's Lane workspace to MCP clients: brands, brand foundation (voice, personas,
    objectives, competitors, market events), traction and presence plans and settings, the action approval
    queue (review, update content, report outcomes, send notifications and outreach), integrations, cycle
    history and an on-demand lane_run_now. 46 tool names are published by the anonymous /health endpoint;
    tool schemas require an authenticated tools/list. Authenticated with an OAuth 2.1 bearer token from the
    co-hosted authorization server (authorization_code + PKCE, dynamic client registration) or a per-user
    X-API-Key (ll_mcp_ prefix) generated in the product app.
  image: https://www.luminarylane.app/images/logo.svg
  humanURL: https://www.luminarylane.app/from-claude/
  baseURL: https://mcp.luminarylane.app/mcp
