aid: luminarylane-app
name: Luminary Lane
description: >-
  Luminary Lane (a product of Lumi5 Labs Pte. Ltd., Singapore) is an agentic AI marketing platform built
  around Lane, a "Chief Marketing AI-Agent" that reads a company's brand foundation, proposes channel tests
  across the 19-channel Traction framework, drafts content and campaigns, and executes approved work through
  connected LinkedIn, Facebook, Instagram, X, Bluesky, YouTube, WordPress, Sanity, GA4, Search Console and
  Google Ads accounts — every consequential action waiting in a human approval queue. It is sold as a
  self-serve monthly subscription priced in weekly "Lane Cycles" (Discover $100/mo to Agency $3,500/mo). The
  machine-facing surface is a remote Model Context Protocol server at mcp.luminarylane.app/mcp exposing 46
  workspace tools behind OAuth 2.1 (RFC 8414/9728/7591 discovery) or a per-user API key, plus an A2A agent
  card, two llms.txt files, a Claude Cowork plugin with provider-published skills, and fourteen open-source
  stdio MCP servers on npm and PyPI. No OpenAPI, GraphQL, AsyncAPI or SOAP contract is published.
