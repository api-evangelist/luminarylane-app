      - Platform chat and expert controls included
      - Up to 2 cycles on one priority space in a week
    overage: none
    limits:
      active_spaces: 5
      cycles_per_week: 5
      max_cycles_per_space_per_week: 2
  - id: scale
    name: Scale
    price: 1500.00
    currency: USD
    period: month
    included:
      - Up to 15 active spaces
      - 15 Lane Cycles per week
      - Slack collaboration included
      - Up to 3 cycles on one priority space in a week
    overage: none
    limits:
      active_spaces: 15
      cycles_per_week: 15
