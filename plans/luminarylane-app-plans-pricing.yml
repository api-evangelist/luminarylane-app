model: >-
  Monthly subscription priced on "Lane Cycles" — scheduled operating passes per active brand/voice space
  per week — plus a separately approved, capped external operating budget for AI generation, media, email
  delivery, data providers and ad spend that is never billed as overage. Self-serve checkout via Stripe;
  no sales call required. The plan is explicitly "not a token bundle". API/MCP access is not sold as a
  separate tier: the remote MCP server is reached with a per-user API key from any paid account.
plans:
  - id: discover
    name: Discover
    price: 100.00
    currency: USD
    period: month
    included:
      - 1 active space (brand or voice)
      - 1 Lane Cycle per week
      - Max 1 cycle per space per week
      - Personal first-run onboarding
      - Discovery, recommendations and approvable action proposals
      - Async workflow control in the platform
    overage: none — cycles do not roll over; Lane pauses scheduled runs until the weekly budget reopens Monday
    limits:
      active_spaces: 1
      cycles_per_week: 1
      max_cycles_per_space_per_week: 1
  - id: growth
