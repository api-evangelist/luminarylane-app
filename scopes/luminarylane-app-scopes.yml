summary: >-
  Luminary Lane publishes no OpenAPI (derive-oauth-scopes.py reports 0 oauth2 providers for this repo),
  so this file records what the live RFC 8414 / RFC 9728 discovery documents on the MCP host declare.
  Neither document carries scopes_supported, the provider documents no scope or permission vocabulary
  anywhere public, and the alternative X-API-Key credential is a per-user key with no scoping surface.
  An OAuth client therefore requests a token with no scope parameter and receives whatever the signed-in
  user's workspace access allows. The absence is the measurement; no scope names were invented.
model: >-
  Unscoped OAuth 2.1 authorization-code + PKCE against a first-party authorization server co-hosted with
  the MCP resource. Authorization is workspace/brand-membership based, not scope based.
